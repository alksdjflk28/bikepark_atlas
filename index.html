<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bikepark Atlas – alle Bikeparks in Europa auf einer Karte: 202 Parks in 23 Ländern, mit Bergbahn und Trailparks ohne Lift. Mit Öffnungszeiten, Tageskartenpreis, Lines, Auslastung pro Wochentag und Routenplaner."
    />
    <meta name="theme-color" content="#0e1013" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e1013'/%3E%3Cpath d='M6 24 16 7l10 17z' fill='%23a3e635'/%3E%3C/svg%3E"
    />
    <title>Bikepark Atlas – alle Bikeparks auf einer Karte</title>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" id="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M12 2 2 21h20L12 2zm0 5.6L18.3 19H5.7L12 7.6z" />
          </svg>
        </span>
        <span class="brand-name">Bikepark&nbsp;Atlas</span>
      </a>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" stroke-linecap="round" />
        </svg>
        <input
          id="search"
          type="search"
          placeholder="Park, Region oder Land suchen …"
          autocomplete="off"
          aria-label="Bikeparks durchsuchen"
        />
        <kbd id="result-count">202</kbd>
      </div>

      <button class="btn btn-ghost" id="list-btn" type="button">Alle Parks</button>
    </header>

    <div id="map" role="application" aria-label="Karte mit allen Bikeparks"></div>

    <div class="hint" id="hint">
      <span class="hint-dot" aria-hidden="true"></span>
      Klicke eine Markierung, um Öffnungszeiten, Preise und den Routenplaner zu öffnen
    </div>

    <aside class="sidebar" id="sidebar" aria-hidden="true" aria-label="Parkdetails">
      <div class="sidebar-inner" id="sidebar-content"></div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
